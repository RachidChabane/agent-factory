# yaml-language-server: $schema=../schema/config.schema.json
#
# Agent Factory configuration: ~/.agent-factory/config.yaml, or $AGENT_FACTORY_HOME/config.yaml.
# Relative paths resolve against the factory home; "~/" against your home directory.
# Secrets are never written here: { fromEnvironment: NAME } reads them from the environment.
version: 1

server:
  host: 127.0.0.1
  port: 7430
  # The address notifications link to; null means http://<host>:<port>.
  publicUrl: null
  # none: loopback only. tailscale: serve the cockpit on the tailnet and require its identity header.
  remoteAccess:
    kind: none

claude:
  command: [claude]
  niceness: 10
  # Directories agent runs may write besides their worktree.
  writableDirectories: [cache]
  # Each account is a Claude login: CLAUDE_CONFIG_DIR=<configDir> claude /login. No account: the default login.
  accounts:
    - name: primary
      configDir: ~/.claude-primary
      billing: subscription
  # Subscription usage comes from the CLI's own usage report, which costs no tokens.
  usage:
    refreshMinutes: 10
    staleAfterMinutes: 30

budget:
  # No new agent run starts on an account once a limit reaches this share.
  pauseAt:
    session: 0.9
    weeklyAll: 0.85
    weeklyScoped: 0.85
  # none, or US dollars of API-equivalent spend per UTC day.
  dailyCapUsd: none
  # none, or a ceiling on the budget of any single agent run.
  perRunCapUsd: none

resources:
  minimumFreeMemoryPercent: 40
  # normal or warn: the memory pressure above which no agent run starts.
  pauseAbovePressure: normal
  # Agent runs at once, across every project.
  maxConcurrentRuns: 1

daemon:
  pollIntervalSeconds: 30
  mergeWatchIntervalMinutes: 10
  issueRefreshSeconds: 120

notifications:
  dedupeWindowMinutes: 30
  channels:
    - kind: system
    - kind: slack
      webhookUrl: { fromEnvironment: AGENT_FACTORY_SLACK_WEBHOOK_URL }

# Read-only checks of the command-line tools the projects rely on, shown in the cockpit and run by `validate`.
tools:
  - name: kubectl
    description: Reads the clusters the environments run on
    check: [kubectl, auth, whoami]
    version: [kubectl, version, --client]
    fix: kubectl config use-context <context>
    timeoutSeconds: 20
  - name: vault
    description: Reads the secrets the deployments use
    check: [vault, token, lookup, -format=json]
    fix: vault login -method=oidc
    # Started by the cockpit's Log in button and by `agent-factory tool login vault`: it must need no terminal.
    login: vault login -method=oidc -no-print
    # Run on a schedule while the factory runs; each run is recorded and the tool checked again.
    keepAlive: { command: vault token renew -increment=2h, everyMinutes: 45 }

defaults:
  roles:
    acceptance-author: { model: opus, effort: medium, maxBudgetUsd: 8, maxTurns: 120, timeoutMinutes: 30 }
    implementer:
      model: opus
      effort: low
      maxBudgetUsd: 10
      maxTurns: 150
      timeoutMinutes: 60
      escalation: { model: opus, effort: high }
    reviewer: { model: opus, effort: medium, maxBudgetUsd: 3, maxTurns: 60, timeoutMinutes: 20 }
    challenger: { model: opus, effort: high, maxBudgetUsd: 8, maxTurns: 150, timeoutMinutes: 40 }
    auditor: { model: opus, effort: medium, maxBudgetUsd: 4, maxTurns: 80, timeoutMinutes: 25 }

projects:
  - id: storefront
    name: Storefront
    forge:
      kind: github
      repository: example-org/storefront
      # Merge with the administrator bypass (gh pr merge --admin), for an operator the base
      # branch's rules let bypass the required review.
      mergeWithBypass: false
    baseBranch: main
    clone: clone
    commitIdentity: { name: Example Factory, email: factory@example.invalid }
    worktrees: { size: 3 }
    concurrency: { issues: 1, ceiling: 3 }
    setup:
      - name: install
        run: npm ci
        network: downloads the locked dependencies from the npm registry
    gate:
      beforeAcceptance:
        - { name: lint, run: npm run lint }
      afterAcceptance:
        - { name: unit, run: npm test }
      timeoutMinutes: 30
    environment:
      passthrough: [PATH, HOME, LANG, TERM, TMPDIR, USER]
      set: { CI: "1" }
    # What the checks of user-interface issues need running: the factory starts it in the workspace under test
    # before their checks and the agents' runs, waits until each service answers, and stops it afterwards.
    # Every command in it gets AGENT_FACTORY_SLOT (0, 1, ...) to keep the stacks of issues running at once apart.
    stack:
      issueTypes: [ui]
      services:
        - name: web
          run: PORT=$((3000 + AGENT_FACTORY_SLOT)) npm run dev
          ready: curl -fsS "http://127.0.0.1:$((3000 + AGENT_FACTORY_SLOT))/healthz"
    # What confined code may reach beyond its worktree. Agents may always run the setup and gate commands above.
    sandbox:
      # Lets the agents look package versions up; registry credentials stay unreadable.
      shellCommands: ["npm view *"]
      allowedDomains: [registry.npmjs.org]
      # true lets agents and gate commands drive the container engine. A container can mount any directory
      # the engine shares and reach any network: what runs through the engine is not confined.
      docker: false
    issueTypes:
      - id: feature
        proof: fails-on-base
        checks: unit or integration tests in the repository's test layout
        commit: { type: feat }
      - id: ui
        proof: fails-on-base
        checks: a Playwright journey asserting what the criterion says is visible or possible, with the screenshots the expected proof names
        commit: { type: feat, scope: web }
        evidence: [acceptance-tests, screenshots]
      - id: fix
        proof: fails-on-base
        checks: a test reproducing the bug
        commit: { type: fix }
      - id: security
        proof: fails-on-base
        checks: a test reproducing the attack
        commit: { type: fix }
        review: [security]
      - id: docs
        proof: none
        commit: { type: docs }
    roles:
      implementer: { model: opus }
    knowledge:
      - path: docs/product
    # Other repositories the specs cite ("the icons of example-org/design-tokens at v1.0.0"). At start and in
    # `agent-factory validate`, each becomes a read-only snapshot of the files at "ref", taken from the local clone at
    # "source" and kept in projects/storefront/references/<name>@<ref>; run `git -C <source> fetch --tags` when that
    # clone lacks the ref. Every agent of the project reads the snapshots, the acceptance author and the implementer also
    # copy files from them into their worktree (cp, cp -R), and nothing writes to one.
    # "name" is a lowercase slug, unique in the project; "ref" is a tag or a commit id.
    references:
      - name: design-tokens
        repository: example-org/design-tokens
        ref: v1.0.0
        source: ~/src/design-tokens
    delivery:
      release: { kind: tags, tagPattern: "v*" }
      environments:
        - name: staging
          promotion: automatic
          deployments: { kind: github, environment: storefront-staging }
          health: [{ name: web, url: "https://staging.example.com/healthz" }]
          redeploy:
            workflow: deploy.yml
            inputs: { environment: "{{target}}", version: "{{version}}" }
        - name: production
          promotion: manual
          production: true
          deployments: { kind: github, environment: storefront-production }
          workflowUrl: https://github.com/example-org/storefront/actions/workflows/deploy.yml
    audits:
      ignore:
        - name: Dependency updates
          authors: ["dependabot[bot]"]

  - id: ledger
    name: Ledger
    forge:
      kind: local
      repository: example-org/ledger
      checks: none
    commitIdentity: { name: Example Factory, email: factory@example.invalid }
    gate:
      afterAcceptance:
        - { name: test, run: npm test }
    issueTypes:
      - id: feature
        proof: fails-on-base
        commit: { type: feat }
      - id: fix
        proof: fails-on-base
        commit: { type: fix }
