name: Release

# Publishes the GitHub Release of a version tag pushed by script/release, with its changelog section as notes. Run by
# hand with the tag, it publishes the release of a tag whose publication failed, with the notes of the default branch.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to publish, such as v1.4.0
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: GitHub Release
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","mac-mini"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node tools/release/src/release.ts publish "$TAG"
