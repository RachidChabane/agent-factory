name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A CI runner admits jobs by its own capacity rules; the workstation memory guard does not apply.
  AGENT_FACTORY_SKIP_MEMORY_GUARD: "1"

jobs:
  scan:
    name: Denylist and secret scan
    # A private repository runs on the maintainer's self-hosted macOS runner; a public one on GitHub's runners.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","mac-mini"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install the pinned scanners
        run: |
          script/install-tool gitleaks >> "$GITHUB_PATH"
          script/install-tool actionlint >> "$GITHUB_PATH"
      - name: Lint the workflows
        run: actionlint
      - name: Scan the working tree and the whole history
        run: script/scan

  check:
    name: Lint, type-check and test
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","mac-mini"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the pinned workflow linter
        run: script/install-tool actionlint >> "$GITHUB_PATH"
      - name: Lint and type-check
        run: script/lint
      - name: Test
        run: script/test

  e2e-example:
    name: Example project end to end
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","mac-mini"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Take the storefront example from a spec to a merged pull request
        run: script/e2e-example

  e2e-cockpit:
    name: Cockpit end-to-end
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","mac-mini"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the system libraries of the browser
        if: runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium
      - name: Click every button against a running factory
        run: script/e2e-cockpit
      - name: Keep the traces and logs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-cockpit
          path: build/e2e/
          if-no-files-found: ignore
          retention-days: 7

  screenshots:
    name: Screenshots are current
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","mac-mini"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check that the screenshots match the cockpit and the demonstration
        run: script/screenshots --check
