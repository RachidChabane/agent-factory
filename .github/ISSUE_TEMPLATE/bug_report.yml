name: Bug report
description: Something the factory or the cockpit does wrong.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: The smallest steps that show it, ideally in the demonstration mode (`script/start --demo`).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or commit you run.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or validation output
      description: Output of `script/factory validate` or the relevant log lines. Remove anything private first.
      render: text
