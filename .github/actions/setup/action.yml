name: Set up the workspace
description: Node from .node-version, pnpm from package.json, the dependencies from the lockfile, all kept inside the runner's own directories.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        dest: ${{ runner.temp }}/setup-pnpm
    - name: Keep the package store and browsers in the runner's tool cache
      shell: bash
      run: |
        {
          echo "npm_config_store_dir=${RUNNER_TOOL_CACHE}/pnpm-store"
          echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TOOL_CACHE}/ms-playwright"
        } >> "$GITHUB_ENV"
    - name: Give the command sandbox what it needs on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq bubblewrap
        # Ubuntu lets only programs with an AppArmor profile create user namespaces, which bubblewrap needs.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Install the dependencies
      shell: bash
      run: script/setup
